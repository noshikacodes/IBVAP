version: '3.8'

# IBVAP Local Development Infrastructure Services
# Run: docker compose -f docker-compose.dev.yml up -d

services:
  # In-memory broker for AI alert queues and inter-process communication
  redis:
    image: redis:7-alpine
    container_name: ibvap-dev-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Ultra-low latency RTSP / WebRTC / MSE Media Server for CCTV feeds
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: ibvap-dev-mediamtx
    ports:
      - "8554:8554"   # RTSP
      - "1935:1935"   # RTMP
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC
    environment:
      - MTX_PROTOCOLS=tcp,udp
    restart: unless-stopped
