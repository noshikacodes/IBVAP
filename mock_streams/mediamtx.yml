# MediaMTX Configuration for IBVAP Local Development (v1.20+)
# Documentation: https://github.com/bluenviron/mediamtx

logLevel: info
logDestinations: [stdout]

# Global authentication (disabled for local dev)
authMethod: internal

# RTSP Server Configuration
rtsp: yes
rtspTransports: [tcp, udp]
rtspEncryption: "no"
rtspAddress: :8554
rtspsAddress: :8555
rtpAddress: :8000
rtcpAddress: :8001

# RTMP Server Configuration
rtmp: yes
rtmpAddress: :1935

# HLS Server Configuration
hls: yes
hlsAddress: :8888
hlsAllowOrigin: "*"
hlsAlwaysRemux: yes

# WebRTC Server Configuration
webrtc: yes
webrtcAddress: :8889

# Defined Stream Paths
paths:
  # Multi-camera simulated demo streams
  ibvap-cam01:
    source: publisher

  ibvap-cam02:
    source: publisher

  ibvap-cam03:
    source: publisher

  ibvap-cam04:
    source: publisher

  # Backward compatibility benchmark path
  ibvap-demo:
    source: publisher

  all_others:
    source: publisher
