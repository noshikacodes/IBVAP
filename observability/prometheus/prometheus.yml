global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: "ibvap-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000", "host.docker.internal:8000", "localhost:8000"]
        labels:
          environment: "production"
          service: "ibvap-c2-backend"
